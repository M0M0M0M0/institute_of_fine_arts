# =====================================================================
# docker-compose.yml – SQL Server 2022 in Docker for the development environment
#
# Use it when the machine has NO SQL Server installed. Steps (details in README.md):
#   1. Copy .env.example to .env and set the SA password (.env is never committed)
#   2. docker compose up -d
#   3. dotnet run – in Development the app reads MSSQL_SA_PASSWORD / SQL_PORT from this same .env to connect
#      (Infrastructure/Configuration/DockerEnvConnectionString.cs); User Secrets are optional and override it
#
# The web application still runs normally with dotnet run / F5; only the database runs in Docker.
# =====================================================================
name: institute-of-fine-arts

services:
  sqlserver:
    # SQL Server 2022 Developer edition (free for development)
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ifa-sqlserver
    environment:
      # Required: accept Microsoft's license terms
      ACCEPT_EULA: "Y"
      # Developer edition: full features, for development/testing only
      MSSQL_PID: "Developer"
      # SA password read from .env (at least 8 characters with upper case, lower case, digit and symbol)
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is not set in the .env file}"
    ports:
      # Host port : container port. Change SQL_PORT in .env if 1433 is already used on the machine
      - "${SQL_PORT:-1433}:1433"
    volumes:
      # Keep the database files in a named volume → stopping/removing the container keeps the data
      - ifa-sqldata:/var/opt/mssql
    healthcheck:
      # "Healthy" once sa can log in
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  # Volume holding the SQL Server data files
  ifa-sqldata:
